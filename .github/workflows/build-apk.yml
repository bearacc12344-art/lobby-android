name: Build Lobby APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build the web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee ../gradle.log; exit ${PIPESTATUS[0]}

      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|Could not|FAILED|Execution failed" -A3 gradle.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Smult.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Smult-apk
          path: Smult.apk

      - name: Publish as a release (direct download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lobby for Android (build ${{ github.run_number }})
          body: Tap **Smult.apk** below to download, then open it to install (allow "install unknown apps" if asked).
          files: Smult.apk
          make_latest: true
