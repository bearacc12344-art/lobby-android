<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{tile1}"/>
      <stop offset="1" stop-color="{tile2}"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{rim1}"/>
      <stop offset="1" stop-color="{rim2}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="{glow}" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="{rim2}" stop-opacity="0.25"/>
      <stop offset="1" stop-color="{tile2}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{door}" stop-opacity="0.9"/>
      <stop offset="1" stop-color="{glow}" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded tile with a neon rim -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#rim)"/>
  <rect x="30" y="30" width="452" height="452" rx="100" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="100" fill="url(#glow)"/>
  <!-- light spilling out from under the door -->
  <path d="M150 420 L362 420 L430 470 L82 470 Z" fill="url(#light)" opacity="0.55"/>
  <!-- the door, hand-cut style: grey shadow + white slab with cut-out panels -->
  <path d="M168 104 L346 96 L358 424 L156 430 Z M200 142 L314 138 L318 254 L198 258 Z M198 286 L320 282 L324 392 L196 396 Z"
        transform="translate(-16,18)" fill="{shadow}" fill-rule="evenodd"/>
  <path d="M168 104 L346 96 L358 424 L156 430 Z M200 142 L314 138 L318 254 L198 258 Z M198 286 L320 282 L324 392 L196 396 Z"
        fill="{door}" fill-rule="evenodd"/>
  <path d="M292 300 L310 294 L322 310 L312 328 L294 326 Z" fill="{knob}"/>
  <path d="M296 304 L308 300 L315 311 L309 321 L298 320 Z" fill="#ffffff" opacity="0.6"/>
</svg>
